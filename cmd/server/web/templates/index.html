{{define "content"}}
<h2>Список трат</h2>

{{if .Expenses}}
<table>
 <thead>
  <tr>
   <th>ID</th>
   <th>Сумма</th>
   <th>Описание</th>
   <th>Дата</th>
  </tr>
 </thead>
 <tbody>
  {{range .Expenses}}
  <tr>
   <td>{{.ID}}</td>
   <td>{{printf "%.2f" .Amount}} ₽</td>
   <td>{{.Description}}</td>
   <td>{{.Date.Format "02.01.2006"}}</td>
  </tr>
  {{end}}
 </tbody>
 <tfoot>
  <tr>
   <td colspan="2"><strong>Итого:</strong></td>
   <td colspan="2"><strong>{{printf "%.2f" .Total}} ₽</strong></td>
  </tr>
 </tfoot>
</table>
{{else}}
<p>Трат пока нет. <a href="/add">Добавить первую</a>.</p>
{{end}}
{{end}}
